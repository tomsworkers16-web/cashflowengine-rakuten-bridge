name: M8 safe-publishing checks

on:
  push:
    branches: [main]
    paths:
      - 'm8-agent-node/src/**'
      - 'm8-agent-node/test/**'
      - 'm8-agent-node/package.json'
      - 'm8-agent-node/Update-And-Check.ps1'
      - 'm8-agent-node/Run-M8-Core.ps1'
      - 'm8-agent-node/Install-M8-Startup.ps1'
      - '.github/workflows/m8-safe-publishing.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'm8-agent-node/src/**'
      - 'm8-agent-node/test/**'
      - 'm8-agent-node/package.json'
      - '.github/workflows/m8-safe-publishing.yml'

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    defaults:
      run:
        working-directory: m8-agent-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate PowerShell update script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($file in @('Update-And-Check.ps1','Run-M8-Core.ps1','Install-M8-Startup.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Check no secrets or local business data are tracked
        run: npm run check-secrets
      - name: JavaScript syntax checks
        run: npm run check
      - name: Install runtime packages for end-to-end tests
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Offline safety tests (no credentials, no posting)
        run: npm test
