name: Wake Render for Threads posting

on:
  schedule:
    # JST posting slots: 07:30, 10:30, 12:30, 17:30, 19:30
    # Wake 5 minutes before each slot. GitHub cron is UTC.
    - cron: '25 22 * * *' # 07:25 JST (next day)
    - cron: '25 1 * * *'  # 10:25 JST
    - cron: '25 3 * * *'  # 12:25 JST
    - cron: '25 8 * * *'  # 17:25 JST
    - cron: '25 10 * * *' # 19:25 JST
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Cash Flow Engine bridge
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cashflowengine-rakuten-bridge.onrender.com/health"
          for i in 1 2 3 4 5; do
            code=$(curl -L -sS -o /tmp/cfe-health.txt -w '%{http_code}' --max-time 60 "$URL" || true)
            echo "Attempt $i HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/cfe-health.txt || true
              exit 0
            fi
            sleep 20
          done
          echo "Bridge did not return HTTP 200 after retries"
          exit 1

      - name: Confirm auto-post endpoint is reachable
        shell: bash
        run: |
          curl -L -fsS --max-time 60 \
            "https://cashflowengine-rakuten-bridge.onrender.com/automation/auto-post-status" \
            >/dev/null
